services:
  postgres:
    image: postgres:16
    container_name: jaya-hr-postgres
    environment:
      POSTGRES_DB: hr_analytics
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: metabase_local_password
      MB_DB_HOST: metabase-db
    depends_on:
      - postgres
      - metabase-db

  metabase-db:
    image: postgres:16
    container_name: metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: metabase_local_password
    volumes:
      - metabase_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  metabase_data:
